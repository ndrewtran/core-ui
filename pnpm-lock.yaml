lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .: {}

  packages/catalog:
    dependencies:
      '@core-ui/schema':
        specifier: workspace:*
        version: link:../schema

  packages/schema: {}

  packages/tooling:
    dependencies:
      '@core-ui/catalog':
        specifier: workspace:*
        version: link:../catalog
      '@core-ui/schema':
        specifier: workspace:*
        version: link:../schema

  tooling/audits/repository-policy: {}
