name: Evidence packet
description: Retain proof for one or more roadmap acceptance assertions.
title: "[Evidence] "
labels:
  - type:evidence
  - area:proof
body:
  - type: input
    id: assertions
    attributes:
      label: Evidence assertion IDs
      placeholder: E-G1.3-01, E-G1.3-02
    validations:
      required: true
  - type: input
    id: parent
    attributes:
      label: Parent milestone issue
      placeholder: "#123"
    validations:
      required: true
  - type: textarea
    id: assertion
    attributes:
      label: Assertion being proved
      description: State the falsifiable claim; do not substitute a success-path demonstration.
    validations:
      required: true
  - type: textarea
    id: revisions
    attributes:
      label: Exact revisions and authority tuple
      description: Record source, artifact, binding, package, catalog, token, release-manifest, and environment revisions as applicable.
    validations:
      required: true
  - type: input
    id: source_identity
    attributes:
      label: Source identity
      description: Exact product or repository source identity; do not substitute the executed or proof-tool identity.
    validations:
      required: true
  - type: input
    id: executed_identity
    attributes:
      label: Executed identity
      description: Exact checkout identity that produced the result.
    validations:
      required: true
  - type: input
    id: proof_tool_identity
    attributes:
      label: Proof-tool identity
      description: Exact proof-tool source identity.
    validations:
      required: true
  - type: input
    id: identity_owner
    attributes:
      label: Identity correlation owner
      description: Canonical owner reference defining whether source, executed, and proof-tool identities must match.
    validations:
      required: true
  - type: input
    id: evidence_identity
    attributes:
      label: Evidence identity
      description: Exact retained identity, or the canonical owner-declared N/A record.
    validations:
      required: true
  - type: input
    id: review_packet_identity
    attributes:
      label: Review packet identity
      description: Packet ID, profile, algorithm, digest, and byte length. This task-local identity is not evidence.
    validations:
      required: true
  - type: input
    id: invalidation_domains
    attributes:
      label: Invalidation domains
      description: Values resolved from the active delivery workflow profile; do not invent new values here.
    validations:
      required: true
  - type: textarea
    id: procedure
    attributes:
      label: Reproduction procedure
      description: Commands, fixtures, inputs, environment, and expected outputs.
    validations:
      required: true
  - type: textarea
    id: retained_artifacts
    attributes:
      label: Retained artifacts
      description: Link logs, reports, snapshots, digests, matrices, and negative-path results. Avoid expiring local-only paths.
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Pass
        - Fail
        - Inconclusive
    validations:
      required: true
  - type: input
    id: expiry
    attributes:
      label: Expiry or invalidation condition
      placeholder: Invalidated by a change to specRevision, package tuple, fixture, or proof environment
    validations:
      required: true
  - type: checkboxes
    id: completeness
    attributes:
      label: Packet completeness
      options:
        - label: Positive and required negative paths are retained.
          required: true
        - label: Provenance is sufficient to reproduce this packet from a clean checkout.
          required: true
        - label: No generated artifact was patched to manufacture the result.
          required: true
