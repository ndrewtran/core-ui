name: Architecture maintenance
description: Propose a controlled amendment to architecture or roadmap authority.
title: "[Architecture] "
labels:
  - type:architecture-maintenance
  - area:architecture
body:
  - type: textarea
    id: trigger
    attributes:
      label: Observed trigger
      description: Name the real workflow, failed proof, contradiction, or repeated demand. Speculation alone is insufficient.
    validations:
      required: true
  - type: textarea
    id: current_authority
    attributes:
      label: Current authority and conflict
      description: Cite exact architecture and roadmap headings and explain why implementation cannot remain conformant.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed decision
      description: State the smallest amendment and its single canonical owner.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and pushback
      description: Record rejected options, including why existing concepts cannot express the need.
    validations:
      required: true
  - type: textarea
    id: ontology
    attributes:
      label: Ontology-growth budget
      description: Identify added kinds, fields, relations, commands, revisions, or packages; justify each or state none.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility, migration, and proof impact
      description: Include version/revision effects, invalidated evidence, migration needs, fixture changes, and release impact.
    validations:
      required: true
  - type: textarea
    id: roadmap
    attributes:
      label: Roadmap impact
      description: Name changed entry conditions, deliverables, assertions, scope controls, or deferred capabilities.
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
    validations:
      required: true
  - type: checkboxes
    id: invariants
    attributes:
      label: Invariant checks
      options:
        - label: This does not turn the tracker into architectural authority.
          required: true
        - label: This does not authorize arbitrary agent mutation or a second source of product truth.
          required: true
        - label: Required evidence invalidation and re-proof are explicit.
          required: true
