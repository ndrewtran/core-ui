name: Bounded decision
description: Record a decision needed to activate or complete roadmap work.
title: "[Decision] "
labels:
  - type:decision
body:
  - type: input
    id: parent
    attributes:
      label: Parent milestone or architecture issue
      placeholder: "#123"
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Decision question
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Architectural constraints and evidence
    validations:
      required: true
  - type: textarea
    id: authority_refs
    attributes:
      label: Authority, scope, and evidence references
      description: Cite affected architecture sections, roadmap milestones/evidence IDs, immutable Product Scope IDs, dependencies, release boundary, and explicit non-goals.
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options and trade-offs
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Proposed outcome and reversal conditions
    validations:
      required: true
  - type: textarea
    id: tracker_migration
    attributes:
      label: Open-tracker migration
      description: Name affected issues and Project items, or state N/A with rationale.
    validations:
      required: true
