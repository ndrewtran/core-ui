name: Roadmap milestone
description: Track one architecture-roadmap milestone or gate exit.
title: "[G?.?] "
labels:
  - type:milestone
  - scope:pending
body:
  - type: markdown
    attributes:
      value: |
        The roadmap is normative. This issue records mutable execution state and must not weaken its entry conditions, evidence assertions, or scope controls.
  - type: dropdown
    id: gate
    attributes:
      label: Gate
      options:
        - Gate 0
        - Gate 1
        - Gate 2
        - Gate 3
        - Cross-gate
    validations:
      required: true
  - type: input
    id: roadmap_milestone
    attributes:
      label: Roadmap milestone
      placeholder: G0.0
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: Copy the objective faithfully or link to its exact roadmap heading.
    validations:
      required: true
  - type: textarea
    id: entry_conditions
    attributes:
      label: Entry conditions and dependencies
      description: State the proof required before this issue may move to ready.
    validations:
      required: true
  - type: textarea
    id: deliverables
    attributes:
      label: Locked deliverables
      description: List named owners and outputs. Scope growth requires a separate architecture-maintenance decision.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Acceptance evidence IDs
      placeholder: E-G0.0-01 … E-G0.0-04
    validations:
      required: true
  - type: input
    id: product_scope
    attributes:
      label: Product Scope IDs
      description: Do not infer or invent IDs while the Product Scope companion is unfinished.
      value: Pending — not assigned
    validations:
      required: true
  - type: textarea
    id: controls
    attributes:
      label: Scope controls and non-goals
      description: Preserve the roadmap exclusions that keep this milestone bounded.
    validations:
      required: true
  - type: textarea
    id: exit
    attributes:
      label: Exit condition
    validations:
      required: true
  - type: checkboxes
    id: discipline
    attributes:
      label: Activation discipline
      options:
        - label: Every entry condition is proved before status changes to ready.
          required: true
        - label: Every exit assertion will have a retained evidence issue or packet.
          required: true
        - label: Generated outputs will not be patched as canonical input.
          required: true
